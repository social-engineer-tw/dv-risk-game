<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>接住安全</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section id="home-screen" class="screen screen-active mission-screen" aria-labelledby="home-title">
      <div class="mission-panel home-layout">
        <div class="mission-copy">
          <p class="eyebrow">家暴防治宣導小遊戲</p>
          <h1 id="home-title">接住安全</h1>
          <p class="subtitle">60 秒挑戰：接住綠色支持，把安全值累積到 100。</p>
        </div>

        <aside class="mission-visual" aria-hidden="true">
          <img src="assets/images/hero-illustration.png" alt="" onerror="this.hidden=true">
        </aside>

        <button id="start-button" class="primary-button mission-start" type="button">開始挑戰</button>
      </div>
    </section>

    <section id="instructions-screen" class="screen instructions-screen" aria-label="玩法說明" aria-hidden="true">
      <div class="mission-panel instructions-layout">
        <figure class="instructions-card">
          <img
            src="assets/images/game-instructions-visual.png"
            alt="接住安全遊戲說明圖"
            onerror="this.hidden=true; this.nextElementSibling.hidden=false;"
          >
          <figcaption class="instructions-placeholder" hidden>遊戲說明圖片載入中</figcaption>
        </figure>

        <div class="instructions-actions">
          <button id="play-button" class="primary-button" type="button">開始遊戲</button>
          <button id="instructions-home-button" class="secondary-button" type="button">返回首頁</button>
        </div>
      </div>
    </section>

    <section id="game-screen" class="screen" aria-label="任務進行中" aria-hidden="true">
      <div class="game-wrap mission-game">
        <header class="game-header mission-hud">
          <div class="hud-title">
            <p class="eyebrow">任務進行中</p>
            <p class="hud-subtitle">60 秒挑戰</p>
          </div>

          <div class="risk-panel hud-risk" aria-label="目前安全值">
            <div class="risk-topline">
              <span>安全值</span>
              <strong id="risk-value">20 / 100</strong>
            </div>
            <div class="risk-meter" aria-hidden="true">
              <div id="risk-bar" class="risk-bar"></div>
            </div>
            <div class="risk-thresholds" aria-hidden="true">
              <span>50 累積中</span>
              <span>80 接近通關</span>
              <span>100 通關</span>
            </div>
            <div class="legend-row" aria-label="掉落物圖例">
              <span>🟢 接住支持</span>
              <span>🟠 閃避壓力</span>
              <span>🔴 避開危險</span>
            </div>
            <p id="risk-message" class="risk-message">接住綠色，累積安全。</p>
          </div>

          <div class="timer-box mission-timer" aria-live="polite">
            <span class="timer-label">倒數</span>
            <strong id="time-left">60</strong>
          </div>
        </header>

        <div class="lane-area mission-stage" aria-label="三軌道掉落物遊戲區">
          <div class="lane" aria-label="左軌"></div>
          <div class="lane" aria-label="中軌"></div>
          <div class="lane" aria-label="右軌"></div>
          <div id="countdown-display" class="countdown-display" aria-live="assertive"></div>
          <div id="player-basket" class="player-basket lane-middle" aria-live="polite">
            <span class="basket-icon" aria-hidden="true">🧺</span>
          </div>
        </div>

        <div class="game-message-area" aria-live="polite">
          <p id="item-message" class="item-message"></p>
        </div>

      </div>
    </section>

    <section id="result-screen" class="screen result-screen" aria-labelledby="result-title" aria-hidden="true">
      <div class="mission-panel result-layout">
        <div class="result-hero">
          <p class="eyebrow">任務結算</p>
          <div id="result-badge" class="result-badge">RESULT</div>
          <h2 id="result-title">成功守住</h2>
          <p id="result-description" class="result-description"></p>
        </div>

        <p id="final-risk" class="final-risk">最後安全值：0 / 100</p>

        <section class="summary-card" aria-labelledby="summary-title">
          <h3 id="summary-title">本局回顧</h3>
          <div id="round-summary" class="summary-grid">
            <span>綠色支持 0 次</span>
            <span>橘色壓力 0 次</span>
            <span>紅色危險 0 次</span>
            <span>最高安全值 0</span>
            <span>最高連續支持 0</span>
            <span>距離通關 100 分</span>
          </div>
        </section>

        <p id="challenge-tip" class="challenge-tip">下一次把安全值累積到 100。</p>

        <div id="lesson-list" class="lesson-list">
          <article class="lesson-card">
            <span class="lesson-number">1</span>
            <p>支持累積安全</p>
          </article>
          <article class="lesson-card">
            <span class="lesson-number">2</span>
            <p>壓力會干擾安全</p>
          </article>
          <article class="lesson-card">
            <span class="lesson-number">3</span>
            <p>危險會拉低安全</p>
          </article>
        </div>

        <div class="result-actions">
          <button id="restart-button" class="primary-button" type="button">再挑戰一次</button>
          <button id="home-button" class="secondary-button" type="button">回首頁</button>
        </div>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
